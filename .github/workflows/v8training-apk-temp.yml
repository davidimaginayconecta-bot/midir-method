name: Temporary V8 Training APK build

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.v8training-build/**'

jobs:
  build-apk:
    if: startsWith(github.head_ref, 'v8training-apk-')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v8training-src"
          unzip -t .v8training-build/V8Training-1.0.0-source.zip
          unzip -q .v8training-build/V8Training-1.0.0-source.zip -d "$RUNNER_TEMP/v8training-src"
          PROJECT_DIR="$(find "$RUNNER_TEMP/v8training-src" -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: JavaScript tests
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm test

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/V8Training-1.0.0.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: V8Training-1.0.0-APK
          path: ${{ runner.temp }}/V8Training-1.0.0.apk
          if-no-files-found: error
